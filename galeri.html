<script>

const totalImages = 243; // 🔥 16 tane daha eklendi
const imagesPerPage = 20;

const gallery = document.getElementById('gallery');
const pagination = document.getElementById('pagination');

let currentPage = 1;
let images = [];

// FOTOĞRAF YOLLARI
for(let i = 1; i <= totalImages; i++){
  images.push(`resim/resim${i}.jpg`);
}

// GALERİYİ GÖSTER
function renderGallery(page){

  gallery.innerHTML = '';

  let start = (page - 1) * imagesPerPage;
  let end = Math.min(start + imagesPerPage, images.length);

  for(let i = start; i < end; i++){

    const img = document.createElement('img');

    img.src = images[i];
    img.alt = 'Foto ' + (i + 1);

    img.addEventListener('click', () => {
      openLightbox(i);
    });

    gallery.appendChild(img);
  }
}

// SAYFALAMA
function renderPagination(){

  pagination.innerHTML = '';

  let totalPages = Math.ceil(images.length / imagesPerPage);

  for(let i = 1; i <= totalPages; i++){

    const btn = document.createElement('button');

    btn.textContent = i;

    if(i === currentPage){
      btn.classList.add('active');
    }

    btn.addEventListener('click', () => {

      currentPage = i;

      renderGallery(currentPage);
      renderPagination();
    });

    pagination.appendChild(btn);
  }
}

// LIGHTBOX
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');

let currentIndex = 0;

function openLightbox(index){

  currentIndex = index;

  lightbox.style.display = 'flex';

  lightboxImg.src = images[currentIndex];
}

// GERİ
document.getElementById('prev').addEventListener('click', e => {

  e.stopPropagation();

  currentIndex = (currentIndex - 1 + images.length) % images.length;

  lightboxImg.src = images[currentIndex];
});

// İLERİ
document.getElementById('next').addEventListener('click', e => {

  e.stopPropagation();

  currentIndex = (currentIndex + 1) % images.length;

  lightboxImg.src = images[currentIndex];
});

// LIGHTBOX KAPAT
lightbox.addEventListener('click', () => {

  lightbox.style.display = 'none';
});

// BAŞLANGIÇ
renderGallery(currentPage);
renderPagination();

</script>
